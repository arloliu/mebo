name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  golangci-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          - "1.25"
          - "1.26"
    steps:
    - uses: actions/checkout@v5

    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Display Go version
      run: go version
    - name: Test
      run: make test
    - name: ALP byte identity with fused multiply-add (GOAMD64=v3)
      run: make test-fusion
    # Runners vary in CPU, and the AVX-512 kernel tests skip on one without the instructions,
    # so this step reports what the runner has and, where it has them, fails if a kernel test skips.
    # The Chimp group kernel needs DQ and BW only, so it is checked on runners that lack VBMI too.
    - name: AVX-512 ALP and Chimp group kernels (when the runner supports them)
      run: |
        if grep -qw avx512dq /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo && grep -qw avx512vbmi /proc/cpuinfo; then
          MEBO_REQUIRE_AVX512=1 go test ./internal/encoding/value/alp/ -count=1 -run 'AVX512|Kernel'
        else
          echo "This runner lacks AVX-512 DQ, BW or VBMI: CI checked the scalar ALP paths only."
        fi
        if grep -qw avx512dq /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo; then
          MEBO_REQUIRE_AVX512=1 go test ./internal/encoding/value/chimp/ ./blob/ -count=1 -run 'ChimpGroup'
        else
          echo "This runner lacks AVX-512 DQ or BW: CI checked the scalar Chimp group decode only."
        fi

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26"
        check-latest: true

    - name: Fuzz decoders
      run: make fuzz FUZZ_TIME=30s

    - name: Upload failing inputs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-failures
        path: "**/testdata/fuzz/"
